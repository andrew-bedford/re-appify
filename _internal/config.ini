[App]
; icon shown in the splashscreen while the server starts, and used as the window icon
icon = /re/log/wwwroot/Images/Logo.png
; title shown in the titlebar
title = re/log
; the application to run. A published build, not a source tree: re/app is meant to start an
; application that is installed, which has no .NET SDK and no sources to build from.
executable = /tmp/claude-1000/-re-log/7ca6e91f-2ae5-4115-ac5c-85a4482a6dde/scratchpad/publish/Re.Log
; where that application writes down the address it is listening on. re/app reads this instead of
; assuming a port: a fixed port cannot tell you whether the thing answering is the right application.
endpoint = ~/.config/re/log/server.json
; the name the application answers with at /api/status. re/app refuses to attach to anything that
; gives a different answer.
application = re/log
; how long to wait for the application to answer before giving up and saying so
startup_timeout = 30
; confirmation message shown when the user tries to close the app. If it is not defined, then the app will close without confirmation.
; close_confirmation = Are you sure you want to exit?
; where the application writes its window settings, which re/app reads to decide whether to
; keep the server running and whether to show a tray icon
settings = ~/.config/re/log/desktop.json
